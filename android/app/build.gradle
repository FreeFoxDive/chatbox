apply plugin: 'com.android.application'

def packageJsonFile = file("${rootDir}/../release/app/package.json")
def packageJson = new groovy.json.JsonSlurper().parse(packageJsonFile)
def appVersionName = packageJson.version as String
def versionNumbers = appVersionName.tokenize('.').collect { (it as String).replaceAll('\\D', '') ?: '0' }
def appVersionCode = (versionNumbers.size() > 0 ? versionNumbers[0].toInteger() : 1) * 10000 +
        (versionNumbers.size() > 1 ? versionNumbers[1].toInteger() : 0) * 100 +
        (versionNumbers.size() > 2 ? versionNumbers[2].toInteger() : 0)

def releaseKeystore = file("${rootDir}/.signing/free-release.keystore")
def uploadedKeystore = file("${rootDir}/.signing/uploaded-release.keystore")

tasks.register('ensureReleaseKeystore') {
    doLast {
        def keystoreBase64 = System.getenv('ANDROID_KEYSTORE_BASE64')
        def keystorePath = System.getenv('ANDROID_KEYSTORE_PATH')
        if (keystoreBase64) {
            uploadedKeystore.parentFile.mkdirs()
            uploadedKeystore.bytes = java.util.Base64.decoder.decode(keystoreBase64)
            return
        }
        if (keystorePath) {
            return
        }
        if (releaseKeystore.exists()) {
            return
        }
        releaseKeystore.parentFile.mkdirs()
        def command = [
                'keytool', '-genkeypair',
                '-keystore', releaseKeystore.absolutePath,
                '-storepass', 'chatbox-free',
                '-keypass', 'chatbox-free',
                '-alias', 'chatbox-free',
                '-keyalg', 'RSA',
                '-keysize', '2048',
                '-validity', '10000',
                '-dname', 'CN=Chatbox Free, OU=Free, O=Chatbox, L=Local, ST=Local, C=US'
        ]
        def process = command.execute()
        process.waitForProcessOutput(System.out, System.err)
        if (process.exitValue() != 0) {
            throw new GradleException('Failed to generate the fallback release keystore')
        }
    }
}

android {
    namespace "xyz.chatboxapp.free"
    compileSdk rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "xyz.chatboxapp.free"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode appVersionCode
        versionName appVersionName
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
            ignoreAssetsPattern '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        release {
            def keystoreBase64 = System.getenv('ANDROID_KEYSTORE_BASE64')
            def keystorePath = System.getenv('ANDROID_KEYSTORE_PATH')
            if (keystoreBase64) {
                storeFile uploadedKeystore
                storePassword System.getenv('ANDROID_KEYSTORE_PASSWORD')
                keyAlias System.getenv('ANDROID_KEY_ALIAS')
                keyPassword System.getenv('ANDROID_KEY_PASSWORD')
            } else if (keystorePath) {
                storeFile file(keystorePath)
                storePassword System.getenv('ANDROID_KEYSTORE_PASSWORD')
                keyAlias System.getenv('ANDROID_KEY_ALIAS')
                keyPassword System.getenv('ANDROID_KEY_PASSWORD')
            } else {
                storeFile releaseKeystore
                storePassword 'chatbox-free'
                keyAlias 'chatbox-free'
                keyPassword 'chatbox-free'
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.release
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }
    packagingOptions {
        jniLibs {
            useLegacyPackaging = true
        }
    }
}

repositories {
    flatDir {
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    implementation project(':capacitor-cordova-android-plugins')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
}

afterEvaluate {
    def keystoreTask = tasks.named('ensureReleaseKeystore')
    tasks.named('preBuild').configure {
        dependsOn(keystoreTask)
    }
    tasks.matching { it.name.startsWith('validateSigning') }.configureEach {
        dependsOn(keystoreTask)
    }
}

try {
    apply from: 'capacitor.build.gradle'
} catch (Exception ignored) {
    logger.warn('capacitor.build.gradle is not present yet; run npx cap sync android')
}
